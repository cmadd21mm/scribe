name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Block runtime networking
        run: sh scripts/check-no-runtime-network.sh
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
