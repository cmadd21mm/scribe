name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Block runtime networking
        run: sh scripts/check-no-runtime-network.sh
      - name: Test
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Build installable app
        run: sh scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict dist/Scribe.app
      - uses: actions/upload-artifact@v4
        with:
          name: Scribe-macOS
          path: dist/Scribe.app
