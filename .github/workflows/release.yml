name: release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build universal development DMG
        run: sh scripts/package-dmg.sh
      # Public releases are uploaded separately after Developer ID signing,
      # Apple notarization, and ticket stapling. Never publish this ad-hoc
      # signed CI artifact as the user-facing download.
      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: Scribe-${{ github.ref_name }}-unsigned
          path: dist/Scribe.dmg
